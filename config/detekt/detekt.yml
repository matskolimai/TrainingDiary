naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
    # Detekt's default test paths, plus :app's sharedTest, which holds the acceptance cases both test source sets run.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/sharedTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'

style:
  MagicNumber:
    # Detekt's default excludes, plus :app's sharedTest, where cases state expected values as literals.
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/sharedTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'
      - '**/jsTest/**'
      - '**/iosTest/**'
      - '**/*.kts'
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'androidx.compose.ui.unit.dp'
        reason: 'Take sizes from Spacing or Sizes in :core:design-system.'
    excludes: ['**/Spacing.kt', '**/Sizes.kt', '**/test/**', '**/androidTest/**']
